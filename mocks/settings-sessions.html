<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings – Active sessions – HyperCS</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ebebeb; font-family: Roboto, Helvetica, Arial, sans-serif; color: #444; font-size: 15px; }
  a { color: #3c7ab5; text-decoration: none; }
  main { background: #fff; padding: 20px 20px 40px; }
  .panel { margin: 0 5px 30px; max-width: 760px; border: 1px solid #e8e8e8; }
  .panel-head { background: #eee; padding: 15px; }
  .panel-head h3 { margin: 0; font-size: 20px; font-weight: 500; color: #333; }
  .panel-head p { margin: 2px 0 0; font-size: 12px; color: #222; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 15px; font-size: 14px; border-bottom: 1px solid #eee; }
  th { color: #777; font-weight: 500; text-transform: uppercase; font-size: 12px; }
  .current-tag { background: #4a82b8; color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
  .btn-link { background: none; border: 0; color: #c0392b; cursor: pointer; font-family: inherit; font-size: 14px; padding: 0; }
</style>
</head>
<body>
<main>
  <section class="panel" id="sessions">
    <div class="panel-head">
      <h3>Active sessions</h3>
      <p>Devices currently signed in to your account.</p>
    </div>
    <table>
      <thead><tr><th>Device</th><th>Created</th><th>Last active</th><th></th></tr></thead>
      <tbody>
        <tr>
          <td>Chrome on macOS <span class="current-tag">This device</span></td>
          <td>7 days ago</td>
          <td>Just now</td>
          <td></td>
        </tr>
        <tr>
          <td>Safari on iPhone</td>
          <td>2 days ago</td>
          <td>1 hour ago</td>
          <td><button class="btn-link" type="button">Revoke</button></td>
        </tr>
      </tbody>
    </table>
  </section>
</main>
</body>
</html>
