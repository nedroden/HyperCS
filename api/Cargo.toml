[workspace]
resolver = "3"
members = ["crates/domain", "crates/db", "crates/api", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hypercs-domain = { path = "crates/domain" }
hypercs-db = { path = "crates/db" }
hypercs-api = { path = "crates/api" }

axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.10.2", features = ["cookie", "typed-header"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5.3"
tower-http = { version = "0.6.6", features = ["trace", "cors", "set-header", "limit", "request-id", "util"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "macros",
    "chrono",
    "uuid",
    "json",
] }

thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

uuid = { version = "1.18.1", features = ["v7", "serde"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
time = "0.3.45"

validator = { version = "0.20.0", features = ["derive"] }
argon2 = "0.5.3"
rand = "0.8.5"
sha2 = "0.10.9"
base64 = "0.22.1"
unicode-normalization = "0.1.24"

utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

clap = { version = "4.5.51", features = ["derive"] }
dotenvy = "0.15.7"
const_format = "0.2.34"
anyhow = "1.0.100"

http-body-util = "0.1.5"

[profile.release]
opt-level = 2
